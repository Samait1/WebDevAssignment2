<!DOCTYPE html><!--This is a basic HTML5 document.-->
<html lang="en"><!--The lang attribute specifies the language of the page.  -->
<head><!--The head element contains meta information about the document.-->
    <meta charset="UTF-8"><!--The meta charset attribute specifies the character encoding for the HTML document.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--The meta tag sets the viewport attributes for responsive design.-->
    <title>Home page</title><!--The title element specifies the title of the document, which is displayed in the browser's title bar or tab.-->
</head>
<body></body><!--The body element contains the visible content of the HTML document.-->
<a href="WorldWideWeb.html">Go to World Wide Web Page</a><!--The a element defines a hyperlink, and the href attribute specifies the URL of the page the link goes to.-->
